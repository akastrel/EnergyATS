# ============================================================================
# APPDAEMON: АВР ГЕНЕРАТОРОВ / ENERGY ATS
# ============================================================================
#
# Файл содержит только deployment-настройки и изменяемые параметры алгоритма.
# Сама логика находится в:
#
#   ats_core.py   — чистый конечный автомат, который можно unit-тестировать;
#   energy_ats.py — адаптер между этим автоматом и Home Assistant/AppDaemon.
#
# Временные/температурные параметры специально НЕ зашиты в Python: после первых
# физических испытаний их можно спокойно подбирать здесь по реальному поведению
# генераторов, не меняя алгоритм АВР.
#
# ============================================================================
# ЗАЩИТА ПЕРВОГО ЗАПУСКА: armed
# ============================================================================
#
# ОБЯЗАТЕЛЬНО оставить `armed: false` при установке и первом запуске.
#
# armed: false
#   AppDaemon загружает приложение, проверяет конфигурацию и видимость сущностей,
#   но НЕ выполняет никаких команд switch/button/service силовой системе.
#
# armed: true
#   Action, сформированные ATSController, реально выполняются в Home Assistant.
#
# На `true` переходим только после того, как:
#   1. unit-тесты проходят;
#   2. AppDaemon видит все обязательные сущности;
#   3. мы проверили фактические состояния Grid/Generator/REMOTE/selector/ESTOP;
#   4. отдельно согласовали первый сценарий физического испытания.
# ============================================================================

energy_ats:
  module: energy_ats
  class: EnergyATS
  plugin: HASS

  # Главный deployment-предохранитель. Для первого запуска НЕ МЕНЯТЬ.
  armed: false

  # После restart HA/AppDaemon даём ESPHome, Bolid и template-сущностям время
  # восстановить реальные состояния. Только затем выполняется recovery.
  #
  # Если обязательные сущности всё ещё unavailable, приложение не начинает
  # управление, а повторяет проверку каждые 15 секунд.
  startup_delay: 30

  # Период основного цикла state machine. Алгоритм лёгкий и детерминированный;
  # 1 секунда достаточно быстро для АВР и при этом удобно для анализа логов.
  tick_seconds: 1

  # ==========================================================================
  # ПАРАМЕТРЫ АВР
  # ==========================================================================
  parameters:

    # ------------------------------------------------------------------------
    # ПРОПАДАНИЕ / ВОЗВРАТ ОСНОВНОЙ СЕТИ
    # ------------------------------------------------------------------------

    # Grid Input Ready должен непрерывно быть OFF это время, прежде чем АВР
    # вообще начнёт резервную сессию. Короткие моргания сети генератор не запускают.
    grid_failure_delay: 5

    # После появления Grid Input Ready сеть должна оставаться непрерывно Ready
    # в течение этого интервала. Любой новый провал полностью сбрасывает выдержку.
    # Только после успешных 60 секунд начинается возврат дома на Grid.
    grid_restore_stable_time: 60

    # ------------------------------------------------------------------------
    # ЗАПУСК / ОСТАНОВКА ГЕНЕРАТОРОВ
    # ------------------------------------------------------------------------

    # DKG116 самостоятельно делает три попытки прокрутки. ATS не вмешивается
    # между ними, а ждёт физический binary_sensor.generator_*_is_running.
    # Если RUNNING так и не появился — выбранный генератор считается отказавшим.
    generator_start_timeout: 90

    # После штатного снятия REMOTE START ждём физическое исчезновение RUNNING.
    # Если двигатель не остановился за это время — TERMINAL + Emergency Stop.
    generator_stop_timeout: 90

    # После возврата дома на основную сеть генератор ещё это время работает
    # без нагрузки. Правило единое и для обычного возврата, и если Grid успел
    # стабилизироваться ещё во время START/CHOKE/PREHEAT.
    generator_stop_delay: 300

    # ------------------------------------------------------------------------
    # ПОДТВЕРЖДЕНИЕ СИЛОВОЙ КОММУТАЦИИ
    # ------------------------------------------------------------------------

    # Максимальное время ожидания физического подтверждения каждого перехода:
    #   - дом действительно перестал питаться от Grid;
    #   - дом действительно начал питаться от Generator;
    #   - при возврате исчезло питание от Generator;
    #   - после подключения Grid дом действительно питается от Grid.
    #
    # Если ожидаемого физического результата нет при наличии исходных условий,
    # причина считается неопределённой и ATS уходит в TERMINAL.
    transfer_confirmation_timeout: 60

    # ------------------------------------------------------------------------
    # ВОЗДУШНАЯ ЗАСЛОНКА / CHOKE
    # ------------------------------------------------------------------------
    #
    # Позже здесь будет использоваться температура двигателя. Пока её нет,
    # температура гаража служит грубой оценкой холодного/горячего старта.
    # Если sensor.garage_temperature недоступен — всегда выбирается cold start.
    #
    # Стартовое значение для практической настройки:
    #   T < +10 °C  -> перед запуском физически ЗАКРЫТЬ заслонку;
    #   T >= +10 °C -> запускать с физически ОТКРЫТОЙ заслонкой.
    #
    # ВАЖНО: текущие entity_id ESPHome названы наоборот относительно механики:
    #   button.generator_*_choke_open  = физически ЗАКРЫТЬ заслонку (cold start)
    #   button.generator_*_choke_close = физически ОТКРЫТЬ заслонку (RUN/hot)
    choke_temperature: 10

    # При cold start после появления RUNNING заслонка остаётся физически закрытой
    # ещё это время. Затем она открывается, и только после этого начинается
    # отсчёт основного прогрева перед подключением нагрузки.
    choke_hold_time: 10

    # ------------------------------------------------------------------------
    # ПРОГРЕВ ПЕРЕД НАГРУЗКОЙ
    # ------------------------------------------------------------------------
    #
    # Отсчёт preheat начинается после перевода заслонки в нормальное RUN-положение.
    # Температура гаража пока используется как приближение температуры двигателя.
    # Если температура недоступна, берём самый длинный интервал — 5 минут.
    preheat:

      # Границы температурных диапазонов.
      warm_temperature: 10
      cool_temperature: -5
      cold_temperature: -10

      # T >= +10 °C
      warm_seconds: 30

      # -5 °C < T < +10 °C
      cool_seconds: 60

      # -10 °C < T <= -5 °C
      cold_seconds: 180

      # T <= -10 °C, а также sensor.garage_temperature unavailable
      very_cold_seconds: 300
