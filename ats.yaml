# Home Assistant package для Energy ATS 0.6.x.
#
# A/B — стабильные аппаратные слоты. Человеко-читаемые имя, модель и PRIMARY
# поступают из Generator Controller через Home Assistant.
#
# Физическая схема и требования:
#   docs/PHYSICAL_POWER_TOPOLOGY_RU.md
#   docs/REQUIREMENTS_RU.md
#
# Обязательные внешние entities core ATS:
# binary_sensor.grid_input_ready
# binary_sensor.house_powered_by_grid
# binary_sensor.house_powered_by_generator
# binary_sensor.generator_a_is_running
# binary_sensor.generator_b_is_running
# switch.generator_a_remote_start
# switch.generator_b_remote_start
# button.generator_a_choke_to_cold_start
# button.generator_a_choke_to_run
# button.generator_b_choke_to_cold_start
# button.generator_b_choke_to_run
# sensor.generator_a_name
# sensor.generator_b_name
# sensor.generator_a_model
# sensor.generator_b_model
# select.primary_generator
# switch.generators_emergency_stop
# switch.grid_power
# switch.use_generator_as_power_source
#
# Soft dependencies Load Manager (нужны только при load_management_enabled=true):
# sensor.generator_a_nominal_power
# sensor.generator_a_maximum_power
# sensor.generator_b_nominal_power
# sensor.generator_b_maximum_power
# binary_sensor.generator_meter_status
# sensor.generator_power
# switch.non_critical_loads_first_floor
# switch.non_critical_loads_basement_floor
#
# Необязательная температура:
# sensor.garage_temperature
#
# Прямые команды через hassio.app_stdin:
# start_generator, stop_generator, reset.

input_boolean:
  automatic_generator_transfer:
    name: "Automatic Generator Transfer"
    icon: mdi:transfer

  generator_test_mode:
    name: "Generator Test Mode"
    icon: mdi:test-tube
    # Маркер относится только к НОВЫМ фронтам запуска генератора. Генератор,
    # который начал работать при включённом helper-е, классифицируется как
    # TEST_RUN и не останавливается автоматически только из-за возврата Grid.
