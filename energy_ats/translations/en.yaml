configuration:
  armed:
    name: "Arm hardware control"
    description: "Master deployment safety switch. Keep disabled for the first run."
  tick_seconds:
    name: "ATS tick, s"
    description: "State-machine evaluation interval."
  log_level:
    name: "Log level"
    description: "Use info normally and debug for diagnostics."

  grid_failure_delay:
    name: "Grid failure delay, s"
    description: "How long Grid Input Ready must stay OFF before a generator start is initiated."
  grid_restore_stable_time:
    name: "Grid restore stability time, s"
    description: "How long Grid Input Ready must stay ON before returning the house to Grid and completing outage-related runs."
  transfer_confirmation_timeout:
    name: "Transfer confirmation timeout, s"
    description: "Maximum wait for house_powered_by_* control-circuit feedback after a main contactor transfer step."

  generator_a_enabled:
    name: "Enable generator A"
    description: "Allow the Energy Supervisor to use physical slot A for a new managed session. This is Energy ATS policy; name, model and primary are read from Home Assistant."
  generator_b_enabled:
    name: "Enable generator B"
    description: "Allow the Energy Supervisor to use physical slot B for a new managed session. This is Energy ATS policy; name, model and primary are read from Home Assistant."

  load_management_enabled:
    name: "Enable Load Manager"
    description: "Manage the configured non-critical G1/G2 loads while the house is supplied by the generator bus. Disabled Load Manager does not affect generator start, transfer or Grid return."
  load_measurement_stabilization_time:
    name: "Load Manager measurement stabilization, s"
    description: "Wait after a managed load change before evaluating the new stable generator power."
  load_restore_margin_percent:
    name: "Load Manager nominal reserve, %"
    description: "Required reserve below Nominal Power before another non-critical group may be admitted."
  nominal_overload_time:
    name: "Load Manager nominal overload, s"
    description: "How long power may remain above Nominal Power before LOAD_SHEDDING begins."
  maximum_overload_confirmation_time:
    name: "Load Manager maximum confirmation, s"
    description: "Short confirmation time above Maximum Power before accelerated LOAD_SHEDDING."
  load_restore_retry_interval:
    name: "Load Manager restore retry, s"
    description: "Minimum delay before retrying a group shed by overload or rejected during admission."

  family_presence_entity:
    name: "Family presence HA entity"
    description: "Home Assistant entity used by the exercise scheduler to determine family presence. home/not_home and on/off are supported."

  generator_a_exercise_enabled:
    name: "Generator A scheduled exercise"
    description: "Enable automatic periodic exercise for physical generator slot A."
  generator_a_exercise_interval_days:
    name: "A exercise interval, days"
    description: "Maximum period without a qualifying run before exercise becomes due."
  generator_a_exercise_start_time:
    name: "A exercise start time"
    description: "Daily Home Assistant local-time window in HH:MM format."
  generator_a_exercise_run_minutes:
    name: "A exercise run time, min"
    description: "Minimum continuous RUNNING time required for a successful exercise."
  generator_a_exercise_presence_grace_days:
    name: "A presence grace, days"
    description: "How many days after due family presence may defer exercise."

  generator_b_exercise_enabled:
    name: "Generator B scheduled exercise"
    description: "Enable automatic periodic exercise for physical generator slot B."
  generator_b_exercise_interval_days:
    name: "B exercise interval, days"
    description: "Maximum period without a qualifying run before exercise becomes due."
  generator_b_exercise_start_time:
    name: "B exercise start time"
    description: "Daily Home Assistant local-time window in HH:MM format."
  generator_b_exercise_run_minutes:
    name: "B exercise run time, min"
    description: "Minimum continuous RUNNING time required for a successful exercise."
  generator_b_exercise_presence_grace_days:
    name: "B presence grace, days"
    description: "How many days after due family presence may defer exercise."
