configuration:
  armed:
    name: "Разрешить управление оборудованием"
    description: >-
      Главный deployment-предохранитель. При выключенном параметре приложение
      только наблюдает за состояниями и не выполняет аппаратных service calls.
      Чтение и журналирование состояний остаётся разрешено.
      Для первого запуска обязательно оставить выключенным.
  tick_seconds:
    name: "Период цикла ATS, с"
    description: "Период вызова конечных автоматов в рабочем режиме."
  log_level:
    name: "Уровень логирования"
    description: "info рекомендуется для эксплуатации; debug — для диагностики."

  grid_failure_delay:
    name: "Задержка пропадания Grid, с"
    description: "Сколько Grid Input Ready должен непрерывно быть OFF до начала запуска генератора."
  grid_restore_stable_time:
    name: "Стабилизация вернувшейся Grid, с"
    description: "Сколько Grid Input Ready должен непрерывно быть ON перед возвратом дома на сеть и завершением outage-related запусков."
  transfer_confirmation_timeout:
    name: "Timeout подтверждения силового переключения, с"
    description: "Ожидание house_powered_by_* из цепей управления основных контакторов после шага коммутации."

  generator_a_enabled:
    name: "Разрешить генератор A"
    description: >-
      Разрешить Energy Supervisor использовать физический слот A для новой
      managed-сессии. Это policy-флаг Energy ATS; имя, модель и primary
      читаются из Home Assistant.
  generator_b_enabled:
    name: "Разрешить генератор B"
    description: >-
      Разрешить Energy Supervisor использовать физический слот B для новой
      managed-сессии. Это policy-флаг Energy ATS; имя, модель и primary
      читаются из Home Assistant.

  family_presence_entity:
    name: "HA entity присутствия семьи"
    description: >-
      Entity Home Assistant, по которому Scheduler определяет, находится ли
      семья дома. Поддерживаются состояния home/not_home и on/off.

  generator_a_exercise_enabled:
    name: "Пробные пуски генератора A"
    description: "Разрешить автоматический плановый exercise физического слота A."
  generator_a_exercise_interval_days:
    name: "A: интервал пробного пуска, дней"
    description: "Максимальный период без qualifying run до наступления due."
  generator_a_exercise_start_time:
    name: "A: время пробного пуска"
    description: "Ежедневное локальное окно Home Assistant в формате HH:MM."
  generator_a_exercise_run_minutes:
    name: "A: длительность пробного пуска, мин"
    description: "Минимальная непрерывная работа RUNNING для успешного exercise."
  generator_a_exercise_presence_grace_days:
    name: "A: отсрочка по присутствию, дней"
    description: "Сколько дней после due присутствие семьи может откладывать exercise."

  generator_b_exercise_enabled:
    name: "Пробные пуски генератора B"
    description: "Разрешить автоматический плановый exercise физического слота B."
  generator_b_exercise_interval_days:
    name: "B: интервал пробного пуска, дней"
    description: "Максимальный период без qualifying run до наступления due."
  generator_b_exercise_start_time:
    name: "B: время пробного пуска"
    description: "Ежедневное локальное окно Home Assistant в формате HH:MM."
  generator_b_exercise_run_minutes:
    name: "B: длительность пробного пуска, мин"
    description: "Минимальная непрерывная работа RUNNING для успешного exercise."
  generator_b_exercise_presence_grace_days:
    name: "B: отсрочка по присутствию, дней"
    description: "Сколько дней после due присутствие семьи может откладывать exercise."
