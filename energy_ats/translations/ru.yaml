configuration:
  armed:
    name: "Разрешить управление оборудованием"
    description: >-
      Главный deployment-предохранитель. При выключенном параметре приложение
      только наблюдает за состояниями и не выполняет аппаратных service calls.
      Чтение и журналирование состояний остаётся разрешено.
      Для первого запуска обязательно оставить выключенным.
  tick_seconds:
    name: "Период цикла ATS, с"
    description: "Период вызова конечных автоматов в рабочем режиме."
  log_level:
    name: "Уровень логирования"
    description: "info рекомендуется для эксплуатации; debug — для диагностики."

  grid_failure_delay:
    name: "Задержка пропадания Grid, с"
    description: "Сколько Grid Input Ready должен непрерывно быть OFF до решения о резервном питании: обычного запуска генератора либо UPS Run, если он включён."
  grid_restore_stable_time:
    name: "Стабилизация вернувшейся Grid, с"
    description: "Сколько Grid Input Ready должен непрерывно быть ON перед возвратом дома на сеть и завершением outage-related запусков."
  transfer_confirmation_timeout:
    name: "Timeout подтверждения силового переключения, с"
    description: "Ожидание house_powered_by_* из цепей управления основных контакторов после шага коммутации."

  generator_a_enabled:
    name: "Разрешить генератор A"
    description: >-
      Разрешить Energy Supervisor использовать физический слот A для новой
      managed-сессии. Это policy-флаг Energy ATS; имя, модель и primary
      читаются из Home Assistant.
  generator_b_enabled:
    name: "Разрешить генератор B"
    description: >-
      Разрешить Energy Supervisor использовать физический слот B для новой
      managed-сессии. Это policy-флаг Energy ATS; имя, модель и primary
      читаются из Home Assistant.

  load_management_enabled:
    name: "Включить Load Manager"
    description: >-
      Управлять некритичными группами G1/G2 при питании от генератора.
      При выключении Load Manager не влияет на запуск, transfer и возврат Grid.
  load_measurement_stabilization_time:
    name: "Load Manager: стабилизация измерения, с"
    description: "Сколько ждать после изменения нагрузки до оценки новой устойчивой мощности генератора."
  load_restore_margin_percent:
    name: "Load Manager: запас до номинала, %"
    description: "Какой запас относительно номинальной мощности должен оставаться перед включением следующей некритичной группы."
  nominal_overload_time:
    name: "Load Manager: превышение номинала, с"
    description: "Сколько должна непрерывно сохраняться нагрузка выше Nominal Power до LOAD_SHEDDING."
  maximum_overload_confirmation_time:
    name: "Load Manager: подтверждение Maximum, с"
    description: "Короткое подтверждение нагрузки выше Maximum Power перед ускоренным LOAD_SHEDDING."
  load_restore_retry_interval:
    name: "Load Manager: повтор восстановления, с"
    description: "Минимальный интервал до повторной попытки включить группу, снятую из-за перегрузки или не прошедшую admission."

  delayed_generator_start_enabled:
    name: "UPS Run: отложенный запуск генератора"
    description: "После задержки потери сети ожидать на UPS до порога SoC, TTG или максимального времени. Недостоверные или stale данные отменяют ожидание и возвращают обычный безопасный запуск."
  generator_charge_cycle_enabled:
    name: "UPS Run: циклическая подзарядка от генератора"
    description: "При длительном отключении завершать только собственные cycle-owned автоматические сессии после Target SoC. Ручные и внешние запуски по SoC не останавливаются."
  generator_start_soc:
    name: "UPS Run: заряд батареи для запуска, %"
    description: "При SoC не выше этого уровня ожидание на UPS завершается. Значение должно быть ниже целевого заряда."
  generator_target_charge_soc:
    name: "UPS Run: целевой заряд батареи, %"
    description: "Уровень завершения собственной автоматической cycle-owned подзарядки; должен быть выше порога запуска и не выше 100%."
  generator_min_ttg_before_start:
    name: "UPS Run: минимальный остаток работы UPS, мин"
    description: "При разряде TTG не выше этого значения завершает ожидание. Во время зарядки/поддержания этот порог не применяется."
  generator_max_start_delay:
    name: "UPS Run: максимальное ожидание на UPS, с"
    description: "Предел каждого интервала ожидания; 21600 с = 6 ч. Отсчёт сохраняется после restart и начинается заново после завершённого цикла."

  family_presence_entity:
    name: "HA entity присутствия семьи"
    description: >-
      Entity Home Assistant, по которому Scheduler определяет, находится ли
      семья дома. Поддерживаются состояния home/not_home и on/off.

  generator_a_exercise_enabled:
    name: "Пробные пуски генератора A"
    description: "Разрешить автоматический плановый exercise физического слота A."
  generator_a_exercise_interval_days:
    name: "A: интервал пробного пуска, дней"
    description: "Максимальный период без qualifying run до наступления due."
  generator_a_exercise_start_time:
    name: "A: время пробного пуска"
    description: "Ежедневное локальное окно Home Assistant в формате HH:MM."
  generator_a_exercise_run_minutes:
    name: "A: длительность пробного пуска, мин"
    description: "Минимальная непрерывная работа RUNNING для успешного exercise."
  generator_a_exercise_presence_grace_days:
    name: "A: отсрочка по присутствию, дней"
    description: "Сколько дней после due присутствие семьи может откладывать exercise."

  generator_b_exercise_enabled:
    name: "Пробные пуски генератора B"
    description: "Разрешить автоматический плановый exercise физического слота B."
  generator_b_exercise_interval_days:
    name: "B: интервал пробного пуска, дней"
    description: "Максимальный период без qualifying run до наступления due."
  generator_b_exercise_start_time:
    name: "B: время пробного пуска"
    description: "Ежедневное локальное окно Home Assistant в формате HH:MM."
  generator_b_exercise_run_minutes:
    name: "B: длительность пробного пуска, мин"
    description: "Минимальная непрерывная работа RUNNING для успешного exercise."
  generator_b_exercise_presence_grace_days:
    name: "B: отсрочка по присутствию, дней"
    description: "Сколько дней после due присутствие семьи может откладывать exercise."