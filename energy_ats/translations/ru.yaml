configuration:
  armed:
    name: "Разрешить управление оборудованием"
    description: >-
      Главный deployment-предохранитель. При выключенном параметре приложение
      только наблюдает за состояниями и не выполняет аппаратных service calls.
      Обновление диагностического UI-статуса остаётся разрешено.
      Для первого запуска обязательно оставить выключенным.
  startup_delay:
    name: "Задержка после запуска App, с"
    description: "Время на восстановление Home Assistant, ESPHome и Bolid перед чтением физической картины."
  tick_seconds:
    name: "Период цикла ATS, с"
    description: "Период вызова конечного автомата в рабочем режиме."
  log_level:
    name: "Уровень логирования"
    description: "info рекомендуется для эксплуатации; debug — для диагностики."

  grid_failure_delay:
    name: "Задержка пропадания Grid, с"
    description: "Сколько Grid Input Ready должен непрерывно быть OFF до начала запуска генератора."
  grid_restore_stable_time:
    name: "Стабилизация вернувшейся Grid, с"
    description: "Сколько Grid Input Ready должен непрерывно быть ON перед возвратом дома на сеть."

  manual_idle_warning_seconds:
    name: "Предупреждение о холостом ходе, с"
    description: "Когда напомнить, что вручную запущенный генератор продолжает работать после возврата дома на Grid. Автоматической остановки нет."
  transfer_confirmation_timeout:
    name: "Timeout подтверждения силового переключения, с"
    description: "Ожидание физических house_powered_by_* после каждого шага силовой коммутации."
  primary_generator:
    name: "Основной генератор"
    description: "Первый кандидат для новой управляемой сессии. Автоматического fallback после его отказа в 0.3.0 нет."
  generator_a_enabled:
    name: "Разрешить Generator A"
    description: "Разрешить Supervisor выбирать Elemax для новой сессии."
  generator_b_enabled:
    name: "Разрешить Generator B"
    description: "Разрешить Supervisor выбирать Вепрь для новой сессии."
