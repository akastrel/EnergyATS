name: "Energy ATS"
version: "0.3.1"
slug: "energy_ats"
description: >-
  Energy Supervisor: политика источников, безопасная силовая коммутация и
  отдельные автоматы жизненного цикла генераторов.
url: "https://github.com/akastrel/EnergyATS"
arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true

options:
  armed: false
  startup_delay: 30
  tick_seconds: 1.0
  log_level: "info"

  grid_failure_delay: 5
  grid_restore_stable_time: 60
  manual_idle_warning_seconds: 600
  transfer_confirmation_timeout: 60

  # Политика выбора. Названия, модели, заслонка, прогрев и cooldown находятся
  # в GeneratorProfile внутри generator_controller.py.
  primary_generator: "A"
  generator_a_enabled: true
  generator_b_enabled: true

schema:
  armed: bool
  startup_delay: "int(0,300)"
  tick_seconds: "float(0.2,10)"
  log_level: "list(debug|info|warning|error)"

  grid_failure_delay: "float(0,300)"
  grid_restore_stable_time: "float(0,900)"
  manual_idle_warning_seconds: "float(0,86400)"
  transfer_confirmation_timeout: "float(1,300)"

  primary_generator: "list(A|B)"
  generator_a_enabled: bool
  generator_b_enabled: bool
