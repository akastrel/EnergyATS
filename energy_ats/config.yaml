name: "Energy ATS"
version: "0.5.0"
slug: "energy_ats"
description: >-
  Energy Supervisor: политика источников, безопасная силовая коммутация и
  отдельные автоматы жизненного цикла генераторов.
url: "https://github.com/akastrel/EnergyATS"
arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
stdin: true

options:
  armed: false
  tick_seconds: 1.0
  log_level: "info"

  grid_failure_delay: 5
  grid_restore_stable_time: 60
  transfer_confirmation_timeout: 60

  # Имя, модель и выбор основного генератора являются конфигурацией
  # Generator Controller и читаются из Home Assistant. В App остаются только
  # разрешения на использование физических слотов A/B.
  generator_a_enabled: true
  generator_b_enabled: true

  # Плановые пробные пуски по умолчанию выключены. После включения Scheduler
  # использует один общий HA entity присутствия семьи.
  family_presence_entity: "group.family"

  generator_a_exercise_enabled: false
  generator_a_exercise_interval_days: 30
  generator_a_exercise_start_time: "15:00"
  generator_a_exercise_run_minutes: 10
  generator_a_exercise_presence_grace_days: 7

  generator_b_exercise_enabled: false
  generator_b_exercise_interval_days: 45
  generator_b_exercise_start_time: "15:00"
  generator_b_exercise_run_minutes: 10
  generator_b_exercise_presence_grace_days: 14

schema:
  armed: bool
  tick_seconds: "float(0.2,10)"
  log_level: "list(debug|info|warning|error)"

  grid_failure_delay: "float(0,300)"
  grid_restore_stable_time: "float(0,900)"
  transfer_confirmation_timeout: "float(1,300)"

  generator_a_enabled: bool
  generator_b_enabled: bool

  family_presence_entity: str

  generator_a_exercise_enabled: bool
  generator_a_exercise_interval_days: "int(1,3650)"
  generator_a_exercise_start_time: str
  generator_a_exercise_run_minutes: "int(1,1440)"
  generator_a_exercise_presence_grace_days: "int(0,365)"

  generator_b_exercise_enabled: bool
  generator_b_exercise_interval_days: "int(1,3650)"
  generator_b_exercise_start_time: str
  generator_b_exercise_run_minutes: "int(1,1440)"
  generator_b_exercise_presence_grace_days: "int(0,365)"
