# Generator Controller firmware 0.3.1
# Тонкий аппаратный слой: входы, реле, безопасные импульсы заслонок и телеметрия.
# Сценарии запуска, прогрева и остановки выполняет Python GeneratorController.
# см. https://devices.esphome.io/devices/Waveshare-ESP32-S3-ETH-8DI-8DO/

substitutions:
  device_name: generator-controller
  device_friendly_name: "Generator Controller"
  components_path: components       # Путь к локальной папке меняется если собирается тестовая прошивка
  mac_address: "30:ED:A0:22:06:5B"  # ВАЖНО: MAC адрес, чтобы использовался фиксированный адрес, а не новый при каждом прошивании

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  project:
    name: "akastrel.generator-controller"
    version: "0.3.1"
  on_boot:
    then:
      - pcf85063.read_time

# ==========================================================
# Board Configuration. See: https://devices.esphome.io/devices/Waveshare-ESP32-S3-ETH-8DI-8DO/
# ==========================================================
# Module is ESP32-S3-WROOM-1U-N16R8 (16MB flash, 8MB PSRAM)
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino # esp-idf

# ==========================================================
# Сustom components:  
#   1. Victron VE.Direct UART для связи с VictronSmartShunt, 
#   2. Fuel model для расчёта уровня топлива в баке генератора на основании данных от резистивного топливного датчика
# ==========================================================
external_components:
  - source:
      type: local
      path: ${components_path}
      
# ==========================================================
# Core Configuration
# ==========================================================
logger:
  baud_rate: 0
  level: INFO

# Enable Home Assistant API
api:
  # чтобы в случае проблем с сетью устройство не перезагружалось, а просто переставало отвечать на API запросы
  reboot_timeout: 0s

# Allow Over-The-Air updates
ota:
  - platform: esphome

# ==========================================================
# Network Configuration
# ==========================================================
ethernet:
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  reset_pin: GPIO39
  mac_address: ${mac_address}  # чтобы не генерировался новый при каждом прошивании

# Web UI
#web_server:
#  port: 80
#  log: false

# ==========================================================
# Hardware Buses
# ==========================================================
# I2C Configuration
i2c:
  sda: GPIO42
  scl: GPIO41
  frequency: 100kHz
  id: i2cbus
  scan: true

# 8-bit expander that drives DO1..DO8
pca9554:
  - id: tca9554_hub
    address: 0x20

# ==========================================================
# Time synchronization and Real-time Clock. See: https://esphome.io/components/time.html
# ==========================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf85063.write_time:
  - platform: pcf85063
    id: pcf85063_time

# ==========================================================
# Binary Sensors
# ==========================================================
binary_sensor:

  # ESPHome держит соединение с Home Assistant через API. status отражает именно это соединение
  - platform: status
    name: "Status"

  - platform: template
    name: "Generator Meter Status"
    id: generator_meter_status
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return !id(sdm120).get_module_offline();

  # ==========================================================
  # Waveshare ESP32. Digital Inputs 
  # ==========================================================
  # ДАТЧИК DI1: Генератор A заведен
  - platform: gpio
    name: "Generator A is running"   # ВАЖНО: HomeAssistant ESPHome конструирует entity_id из имени, поэтому лучше сразу давать правильное английское название. Поле id  игнорирует...
    id: generator_a_is_running
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 10ms
    # Сохраняем последние показания SDM120 до того, как он обесточится вместе с генератором.
    # Точный момент остановки дополнительно будет записан Home Assistant как время изменения text_sensor.
    on_release:
      - lambda: |-
          char snapshot[220];
          snprintf(snapshot, sizeof(snapshot),
                   "Elemax stopped | U=%.1f V; I=%.1f A; Hz=%.2f; P=%.0f W; S=%.0f VA; Q=%.0f var; PF=%.3f",
                   id(generator_voltage).state,
                   id(generator_current).state,
                   id(generator_frequency).state,
                   id(generator_power).state,
                   id(generator_apparent_power).state,
                   id(generator_reactive_power).state,
                   id(generator_power_factor).state);
          id(generator_last_stop_snapshot).publish_state(snapshot);
          ESP_LOGW("generator", "%s", snapshot);

  # ДАТЧИК DI2: Генератор B заведен
  - platform: gpio
    name: "Generator B is running"
    id: generator_b_is_running
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 10ms
    on_release:
      - lambda: |-
          char snapshot[220];
          snprintf(snapshot, sizeof(snapshot),
                   "Vepr stopped | U=%.1f V; I=%.1f A; Hz=%.2f; P=%.0f W; S=%.0f VA; Q=%.0f var; PF=%.3f",
                   id(generator_voltage).state,
                   id(generator_current).state,
                   id(generator_frequency).state,
                   id(generator_power).state,
                   id(generator_apparent_power).state,
                   id(generator_reactive_power).state,
                   id(generator_power_factor).state);
          id(generator_last_stop_snapshot).publish_state(snapshot);
          ESP_LOGW("generator", "%s", snapshot);

  # # ДАТЧИК DI3: ... 
  # - platform: gpio
  #   name: "Generator is started"
  #   id: generator_is_started
  #   pin:
  #     number: GPIO6
  #     mode: INPUT_PULLUP
  #     inverted: true
  #   filters:
  #     - delayed_on_off: 10ms

  # - platform: gpio
  #   id: di4
  #   name: "DI4"
  #   pin:
  #     number: GPIO7
  #     mode: INPUT_PULLUP
  #     inverted: true
  #   filters:
  #     - delayed_on_off: 10ms

  # - platform: gpio
  #   id: di5
  #   name: "DI5"
  #   pin:
  #     number: GPIO15
  #     mode: INPUT_PULLUP
  #     inverted: true
  #   filters:
  #     - delayed_on_off: 10ms

  # - platform: gpio
  #   id: di6
  #   name: "DI6"
  #   pin:
  #     number: GPIO16
  #     mode: INPUT_PULLUP
  #     inverted: true
  #   filters:
  #     - delayed_on_off: 10ms

  # - platform: gpio
  #   id: di7
  #   name: "DI7"
  #   pin:
  #     number: GPIO17
  #     mode: INPUT_PULLUP
  #     inverted: true
  #   filters:
  #     - delayed_on_off: 10ms

  # - platform: gpio
  #   id: di8
  #   name: "DI8"
  #   pin:
  #     number: GPIO18
  #     mode: INPUT_PULLUP
  #     inverted: true
  #   filters:
  #     - delayed_on_off: 10ms

# Последний набор электрических параметров перед остановкой любого генератора.
# Это особенно полезно для коротких аварий, которые могут плохо читаться на графике HA.
text_sensor:
  - platform: template
    name: "Generator Last Stop Snapshot"
    id: generator_last_stop_snapshot
    icon: mdi:clipboard-pulse-outline
    entity_category: diagnostic
    update_interval: never

switch:
  # ==========================================================
  # Waveshare ESP32-S3-ETH-8DI-8DO. Digital Outputs
  # Все физические выходы заслонок скрыты от Home Assistant: управление ими разрешено только через кратковременные кнопки ниже. Для того чтобы Home Assistant не мог случайно оставить заслонку открытой или закрытой, что приведёт к поломке привода.
  # ==========================================================

  # DO1: историческое имя OPEN. На установленном приводе это направление
  # физически переводит заслонку в COLD (закрыто для холодного запуска).
  - platform: gpio
    id: generator_a_choke_open_relay
    internal: true
    pin:
      pca9554: tca9554_hub
      number: 0
      mode:
        output: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # DO2: историческое имя CLOSE. На установленном приводе это направление
  # физически переводит заслонку в RUN (открыто для нормальной работы).
  - platform: gpio
    id: generator_a_choke_close_relay
    internal: true
    pin:
      pca9554: tca9554_hub
      number: 1
      mode:
        output: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # DO3: историческое имя OPEN; физическое положение COLD.
  - platform: gpio
    id: generator_b_choke_open_relay
    internal: true
    pin:
      pca9554: tca9554_hub
      number: 2
      mode:
        output: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # DO4: историческое имя CLOSE; физическое положение RUN.
  - platform: gpio
    id: generator_b_choke_close_relay
    internal: true
    pin:
      pca9554: tca9554_hub
      number: 3
      mode:
        output: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # DO5: DKG-116 генератора A — вход REMOTE
  - platform: gpio
    name: "Generator A Remote Start"
    id: generator_a_remote
    icon: mdi:generator-portable
    pin:
      pca9554: tca9554_hub
      number: 4
      mode:
        output: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # DO6: DKG-116 генератора B — вход REMOTE
  - platform: gpio
    name: "Generator B Remote Start"
    id: generator_b_remote
    icon: mdi:generator-portable
    pin:
      pca9554: tca9554_hub
      number: 5
      mode:
        output: true
    inverted: true
    restore_mode: ALWAYS_OFF

  # DO7: Finder — питание розетки зарядного устройства CTEK
  - platform: gpio
    name: "Generator Battery Charger"
    id: generator_battery_charger
    icon: mdi:battery-charging
    pin:
      pca9554: tca9554_hub
      number: 6
      mode:
        output: true
    inverted: false # включение/выключение зарядного устройства - это включение/выключение реле Finder, поэтому инвертирование не нужно.
    # После перезагрузки контроллера зарядное устройство включится автоматически.
    # Это соответствует постоянному поддерживающему заряду АKБ.
    restore_mode: ALWAYS_ON

  # DO8: общий аварийный останов обоих генераторов через Finder/автомобильное реле
  - platform: gpio
    name: "Generators Emergency Stop"
    id: generators_emergency_stop
    icon: mdi:alert-octagon
    pin:
      pca9554: tca9554_hub
      number: 7
      mode:
        output: true
    inverted: true
    # После перезагрузки ESP аварийная команда не должна оставаться активной.
    restore_mode: ALWAYS_OFF

# ==========================================================
# Кратковременное управление приводами воздушных заслонок
# ==========================================================
script:
  - id: generator_a_choke_open_pulse
    mode: restart
    then:
      - script.stop: generator_a_choke_close_pulse
      - switch.turn_off: generator_a_choke_open_relay
      - switch.turn_off: generator_a_choke_close_relay
      - delay: 150ms
      - switch.turn_on: generator_a_choke_open_relay
      - delay: 700ms
      - switch.turn_off: generator_a_choke_open_relay

  - id: generator_a_choke_close_pulse
    mode: restart
    then:
      - script.stop: generator_a_choke_open_pulse
      - switch.turn_off: generator_a_choke_open_relay
      - switch.turn_off: generator_a_choke_close_relay
      - delay: 150ms
      - switch.turn_on: generator_a_choke_close_relay
      - delay: 700ms
      - switch.turn_off: generator_a_choke_close_relay

  - id: generator_b_choke_open_pulse
    mode: restart
    then:
      - script.stop: generator_b_choke_close_pulse
      - switch.turn_off: generator_b_choke_open_relay
      - switch.turn_off: generator_b_choke_close_relay
      - delay: 150ms
      - switch.turn_on: generator_b_choke_open_relay
      - delay: 700ms
      - switch.turn_off: generator_b_choke_open_relay

  - id: generator_b_choke_close_pulse
    mode: restart
    then:
      - script.stop: generator_b_choke_open_pulse
      - switch.turn_off: generator_b_choke_open_relay
      - switch.turn_off: generator_b_choke_close_relay
      - delay: 150ms
      - switch.turn_on: generator_b_choke_close_relay
      - delay: 700ms
      - switch.turn_off: generator_b_choke_close_relay

button:
  # ------------------------------------------------------------------------
  # Однозначный контракт GeneratorController 0.3.x.
  # Имена описывают ФИЗИЧЕСКОЕ положение заслонки, а не старую маркировку
  # направлений привода. Python использует только эти четыре кнопки.
  # ------------------------------------------------------------------------
  - platform: template
    name: "Generator A Choke To Cold Start"
    id: generator_a_choke_to_cold_start
    icon: mdi:snowflake
    on_press:
      - script.execute: generator_a_choke_open_pulse

  - platform: template
    name: "Generator A Choke To Run"
    id: generator_a_choke_to_run
    icon: mdi:engine
    on_press:
      - script.execute: generator_a_choke_close_pulse

  - platform: template
    name: "Generator B Choke To Cold Start"
    id: generator_b_choke_to_cold_start
    icon: mdi:snowflake
    on_press:
      - script.execute: generator_b_choke_open_pulse

  - platform: template
    name: "Generator B Choke To Run"
    id: generator_b_choke_to_run
    icon: mdi:engine
    on_press:
      - script.execute: generator_b_choke_close_pulse

  # Старые имена временно сохранены для безопасного обновления с Energy ATS
  # 0.2.5. Их механический смысл неоднозначен; новый код их не использует.
  - platform: template
    name: "Generator A Choke Open"
    id: generator_a_choke_open
    icon: mdi:arrow-expand-horizontal
    on_press:
      - script.execute: generator_a_choke_open_pulse

  - platform: template
    name: "Generator A Choke Close"
    id: generator_a_choke_close
    icon: mdi:arrow-collapse-horizontal
    on_press:
      - script.execute: generator_a_choke_close_pulse

  - platform: template
    name: "Generator B Choke Open"
    id: generator_b_choke_open
    icon: mdi:arrow-expand-horizontal
    on_press:
      - script.execute: generator_b_choke_open_pulse

  - platform: template
    name: "Generator B Choke Close"
    id: generator_b_choke_close
    icon: mdi:arrow-collapse-horizontal
    on_press:
      - script.execute: generator_b_choke_close_pulse


# ==========================================================
# Modbus Configuration
# ==========================================================
uart:
  # Modbus RTU UART (для SDM120 и других устройств, поддерживающих Modbus RTU)
  - id: uart_modbus
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE
    flow_control_pin: GPIO21

  # Victron SmartShunt VE.Direct UART
  - id: uart_victron
    rx_pin: GPIO47
    baud_rate: 19200

modbus:
  id: modbus1
  uart_id: uart_modbus
  send_wait_time: 350ms
  # SDM120 отвечает быстрее 100 мс. Небольшая пауза между запросами оставляет запас
  # и позволяет завершить полный диагностический опрос за интервал 2 секунды.
  turnaround_time: 100ms

modbus_controller:
  #  SDM120 - однофазный счётчик СЕТИ  (Modbus RTU) 
  - id: sdm120
    address: 1
    modbus_id: modbus1
    update_interval: 2s      # Авария развивается за несколько секунд, поэтому 5-секундного опроса недостаточно
    max_cmd_retries: 0       # Не повторять запросы к обесточенному SDM120
    offline_skip_updates: 0  # Обнаруживать появление SDM120 сразу после запуска генератора
  
sensor:
 # ==========================================================
  # SDM120 Configuration
  # ==========================================================
  # SDM120 Voltage
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Voltage"
    id: generator_voltage
    address: 0x0000
    register_type: read
    value_type: FP32
    # До следующего полезного параметра (Current, 0x0006) есть разрыв.
    # register_count объединяет весь блок 0x0000..0x001F в один Modbus-запрос.
    register_count: 6
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    force_update: true  # публиковать каждый отсчёт в HA, даже если округлённое значение не изменилось

  # SDM120 Current
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Current"
    id: generator_current
    address: 0x0006
    register_type: read
    value_type: FP32
    register_count: 6
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    force_update: true

  # SDM120 Active Power (P)
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Power"
    id: generator_power
    address: 0x000C
    register_type: read
    value_type: FP32
    register_count: 6
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    force_update: true

  # SDM120 Apparent Power (S). Особенно важна для оценки реальной нагрузки генератора.
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Apparent Power"
    id: generator_apparent_power
    address: 0x0012
    register_type: read
    value_type: FP32
    register_count: 6
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    force_update: true

  # SDM120 Reactive Power (Q). Значение публикуется со знаком ровно как его отдаёт счётчик.
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Reactive Power"
    id: generator_reactive_power
    address: 0x0018
    register_type: read
    value_type: FP32
    register_count: 6
    unit_of_measurement: var
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0
    force_update: true

  # SDM120 Power Factor (PF = P / S).
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Power Factor"
    id: generator_power_factor
    address: 0x001E
    register_type: read
    value_type: FP32
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 3
    force_update: true

  # SDM120 Frequency of supply Voltage
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Frequency"
    id: generator_frequency
    address: 0x0046
    register_type: read
    value_type: FP32
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    force_update: true

  # SDM120 Total Imported Energy (kWh)
  - platform: modbus_controller
    modbus_controller_id: sdm120
    name: "Generator Total Imported Energy"
    id: generator_total_imported_energy
    address: 0x0048
    register_type: read
    value_type: FP32
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

# ==========================================================
# Victron SmartShunt параметры, читаемые через VE.Direct UART
# ==========================================================
victron_vedirect:
  id: victron1
  uart_id: uart_victron

  voltage:
    name: "Generator Battery Voltage"

  aux_voltage:
    name: "Generator Aux Battery Voltage"

  current:
    name: "Generator Battery Current"

  power:
    name: "Generator Battery Power"

  soc:
    name: "Generator Battery Charge Level (SOC)"

  ttg_minutes:
    name: "Generator Battery Time Remaining Minutes (TTG)"

  ttg_hours:
    name: "Generator Battery Time Remaining Hours (TTG)"

  used_ah:
    name: "Generator Battery Used Ah"

  alarm_text:
    name: "Generator Battery Alarm Text"

  alarm:
    name: "Generator Battery Alarm"

  discharging:
    name: "Generator Battery Discharging"

  model:
    name: "Generator Battery Monitor Model"
    entity_category: diagnostic

  firmware:
    name: "Generator Battery Monitor Firmware"
    entity_category: diagnostic

  pid:
    name: "Generator Battery Monitor Product ID"
    entity_category: diagnostic

  monitor_mode:
    name: "Generator Battery Monitor Mode"
    entity_category: diagnostic

# ==========================================================
# Расчёт уровня топлива в баке генератора "Вепрь" на основе измерения датчика сопротивления
# ==========================================================
fuel_model:
  id: vepr_fuel_model
  # --------------------------------------------------------------------------
  # Standard ESPHome ADC sensor embedded in the fuel-model configuration.
  # The moving average is applied to voltage before resistance is calculated.
  # A diagnostic name is retained so raw voltage remains visible in HA.
  # --------------------------------------------------------------------------
  adc:
    id: vepr_fuel_adc_voltage
    pin: GPIO1     # На это пин подключен резистивный датчик уровня топлива в баке генератора "Вепрь"
    name: "Vepr Fuel ADC Voltage"
    attenuation: 12db
    update_interval: 500ms
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # Electrical divider parameters  3.3 V --- 330 ohm pull-up --- ADC --- fuel sender --- GND
  supply_voltage: 3.3
  pullup_resistance: 330.0

  # Total imported energy accumulated by SDM120, in kWh.
  energy_sensor: generator_total_imported_energy

  running_sensor: generator_b_is_running

  # Preliminary model coefficients. They will be refined from real runs.
  idle_consumption: 0.65       # L/h
  load_consumption: 0.34       # L/kWh

  # Wait after shutdown before comparing the calculated value with the sender.
  settling_time: 60s

  # Apply 20% of the measured/model difference on each stopped update.
  sync_alpha: 0.20

  # --------------------------------------------------------------------------
  # Vepr tank calibration.
  # Points may be written in any order, but resistance values must be unique.
  # The component sorts them from high resistance / empty to low / full.
  # The first point defines the lower dead zone:
  # 570 ohm means "6 litres or less".
  # measured_level therefore remains at 6 L, while fuel_level may fall below it.
  # --------------------------------------------------------------------------
  calibration:
    - resistance: 570
      litres: 6
    - resistance: 501
      litres: 7
    - resistance: 435
      litres: 8
    - resistance: 365
      litres: 10
    - resistance: 296
      litres: 12
    - resistance: 245
      litres: 14
    - resistance: 227
      litres: 16
    - resistance: 158
      litres: 18
    - resistance: 91
      litres: 20
    - resistance: 33
      litres: 21

  # Main level used by Home Assistant. During operation this is the model value.
  fuel_level:
    name: "Vepr Fuel Level"
    id: vepr_fuel_level

  # Direct sender reading after calibration. It cannot show less than 6 L.
  measured_level:
    name: "Vepr Fuel Level Measured"
    id: vepr_fuel_level_measured

  # Diagnostic value retained for troubleshooting and Elemax calibration.
  resistance:
    name: "Vepr Fuel Sensor Resistance"
    id: vepr_fuel_sensor_resistance

  # Fuel consumed since the current generator run began.
  fuel_used:
    name: "Vepr Fuel Used"
    id: vepr_fuel_used

  # Captured after shutdown and settling: measured_level - fuel_level.
  model_error:
    name: "Vepr Fuel Model Error"
    id: vepr_fuel_model_error

  # Optional diagnostic exposure of the configured coefficients.
  idle_consumption_sensor:
    name: "Vepr Idle Fuel Consumption"

  load_consumption_sensor:
    name: "Vepr Load Fuel Consumption"

