# ============================================================================
# ВЫТЯЖНАЯ ВЕНТИЛЯЦИЯ ЩИТОВОЙ ГАРАЖА ПО ТЕМПЕРАТУРЕ
# ============================================================================
#
# Вентилятор используется для охлаждения щитовой гаража.
#
# Логика управления:
#
#   температура > 29 °C  -> вентилятор ON
#   температура < 27 °C  -> вентилятор OFF
#
# Между порогами 27–29 °C состояние вентилятора не меняется.
# Таким образом создаётся гистерезис 2 °C и исключаются частые
# включения/выключения около одного порога.
#
# Дополнительный trigger Home Assistant Start нужен для восстановления
# правильного состояния после перезапуска HA.
#
# Например:
#   HA перезапустился при температуре 31 °C.
#
# Обычный numeric_state trigger "above: 29" в такой ситуации не обязан
# сработать, поскольку пересечения порога после запуска не произошло.
# Поэтому после старта HA отдельно проверяем текущую температуру.
#
# Если температура при старте находится между 27 и 29 °C,
# состояние вентилятора не меняем.
# ============================================================================

- id: garage_electrical_room_exhaust_fan_temperature
  alias: "Вытяжной вентилятор щитовой гаража по температуре"
  description: >-
    Включает вытяжной вентилятор щитовой гаража при температуре выше 29 °C
    и выключает после охлаждения ниже 27 °C.
  mode: single
  initial_state: true

  triggers:

    # ------------------------------------------------------------------------
    # Перегрев щитовой.
    # ------------------------------------------------------------------------
    - trigger: numeric_state
      entity_id: sensor.garage_electricity_room_temperature
      above: 29
      id: too_hot

    # ------------------------------------------------------------------------
    # Щитовая достаточно охладилась.
    # ------------------------------------------------------------------------
    - trigger: numeric_state
      entity_id: sensor.garage_electricity_room_temperature
      below: 27
      id: cooled_down

    # ------------------------------------------------------------------------
    # Восстановление правильного состояния после перезапуска HA.
    # ------------------------------------------------------------------------
    - trigger: homeassistant
      event: start
      id: ha_start

  conditions: []

  actions:

    # При старте HA даём датчикам немного времени восстановить состояния.
    - if:
        - condition: trigger
          id: ha_start
      then:
        - delay:
            seconds: 30

    - choose:

        # ====================================================================
        # ВКЛЮЧЕНИЕ
        #
        # Срабатывает:
        #   - при переходе температуры выше 29 °C;
        #   - после старта HA, если температура уже выше 29 °C.
        # ====================================================================
        - conditions:
            - condition: template
              value_template: >
                {{
                  trigger.id == 'too_hot'
                  or
                  (
                    trigger.id == 'ha_start'
                    and
                    states('sensor.garage_electricity_room_temperature')
                      | float(-100) > 29
                  )
                }}
          sequence:

            - action: switch.turn_on
              target:
                entity_id: switch.garage_electric_room_exhaust_fan

            - action: logbook.log
              data:
                name: "Вентиляция щитовой гаража"
                entity_id: switch.garage_electric_room_exhaust_fan
                message: >
                  Вытяжной вентилятор включён.
                  Температура щитовой:
                  {{ states('sensor.garage_electricity_room_temperature') | float(0) | round(1) }} °C.

        # ====================================================================
        # ВЫКЛЮЧЕНИЕ
        #
        # Срабатывает:
        #   - при снижении температуры ниже 27 °C;
        #   - после старта HA, если температура уже ниже 27 °C.
        # ====================================================================
        - conditions:
            - condition: template
              value_template: >
                {{
                  trigger.id == 'cooled_down'
                  or
                  (
                    trigger.id == 'ha_start'
                    and
                    states('sensor.garage_electricity_room_temperature')
                      | float(100) < 27
                  )
                }}
          sequence:

            - action: switch.turn_off
              target:
                entity_id: switch.garage_electric_room_exhaust_fan

            - action: logbook.log
              data:
                name: "Вентиляция щитовой гаража"
                entity_id: switch.garage_electric_room_exhaust_fan
                message: >
                  Вытяжной вентилятор выключен.
                  Температура щитовой:
                  {{ states('sensor.garage_electricity_room_temperature')
                     | float(0) | round(1) }} °C.

# ============================================================================
# АВТОМАТИЧЕСКАЯ ПОДЗАРЯДКА ЗАПАСНОЙ ГЕНЕРАТОРНОЙ АКБ
# ============================================================================
#
# Логика:
#
# 1. В штатном режиме зарядное устройство подключено к основной
#    генераторной АКБ.
#
# 2. Если напряжение запасной АКБ ниже 12.4 В НЕПРЕРЫВНО 10 минут,
#    зарядка может быть передана ей только после того, как основная АКБ
#    находится в состоянии "Поддержание".
#
#    Template-trigger ниже требует одновременного выполнения обоих условий
#    в течение 10 минут:
#      - запасная АКБ < 12.4 В;
#      - основная АКБ = "Поддержание".
#
#    Поэтому автоматика не забирает зарядное устройство у основной АКБ,
#    пока та сама ещё заряжается.
#
# 3. Окончание заряда запасной АКБ определяем только по напряжению.
#    Просто увидеть 13.6 В недостаточно: при обычном заряде батарея проходит
#    через это напряжение и по пути ВВЕРХ.
#
#    Поэтому используем numeric_state "below: 13.9".
#    Такой trigger срабатывает только при ПЕРЕХОДЕ через порог сверху вниз.
#
#    Ожидаем следующую нормальную картину зарядного цикла:
#
#      12.x -> 13.x -> ~14.x   основной заряд / absorption
#                           \
#                            -> ~13.6 В   float / поддержание
#
#    Когда напряжение после верхней стадии заряда опускается ниже 13.9 В
#    и остаётся там 10 минут, считаем, что заряд закончен.
#
# 4. После завершения заряда зарядное устройство ВСЕГДА возвращается
#    на основную генераторную АКБ.
#
# Автоматика управляет только ЛОГИЧЕСКИМИ UI-switch:
#
#   switch.generator_battery_charging
#   switch.backup_generator_battery_charging
#
# Физическая последовательность отключить -> переключить -> включить
# находится в самих template switch в energy.yaml.
# ============================================================================

- id: generator_aux_battery_auto_charge
  alias: "Автоматическая зарядка запасной генераторной АКБ"
  description: >-
    Автоматически передаёт зарядное устройство запасной генераторной АКБ,
    когда она разряжена, но только после перехода основной АКБ в поддержание.
    После перехода запасной АКБ в буферный режим возвращает зарядку на основную.
  mode: single
  initial_state: true
  triggers:
    # ------------------------------------------------------------------------
    # НАЧАЛО ЗАРЯДА ЗАПАСНОЙ АКБ
    #
    # Оба условия должны сохраняться непрерывно 10 минут.
    # Если запасная АКБ уже давно разряжена, а основная только сейчас
    # перешла в "Поддержание", отсчёт 10 минут начнётся с этого момента.
    # ------------------------------------------------------------------------
    - trigger: template
      id: start_aux_charge
      value_template: >
        {{
          has_value('sensor.generator_aux_battery_voltage')
          and
          states('sensor.generator_aux_battery_voltage') | float(0) < 12.4
          and
          is_state('sensor.generator_battery_state', 'Поддержание')
          and
          is_state('switch.generator_battery_charging', 'on')
        }}
      for:
        minutes: 10
    # ------------------------------------------------------------------------
    # ЗАВЕРШЕНИЕ ЗАРЯДА ЗАПАСНОЙ АКБ
    #
    # Важен именно переход СВЕРХУ вниз через 13.9 В.
    # Когда заряд только начинается с 12.x В, сущность уже находится ниже
    # 13.9 В, поэтому этот trigger НЕ срабатывает.
    #
    # После достижения ~14.x В и перехода зарядника в float напряжение
    # опускается через 13.9 В. Если оно остаётся ниже порога 10 минут,
    # проверяем, что это действительно запасная АКБ и напряжение находится
    # в разумной области буферного режима.
    # ------------------------------------------------------------------------
    - trigger: numeric_state
      id: aux_charge_complete
      entity_id: sensor.generator_aux_battery_voltage
      below: 13.9
      for:
        minutes: 10

  conditions: []

  actions:
    - choose:
        # ====================================================================
        # Запасная АКБ разряжена, а основная уже в поддержании.
        # Переключаем зарядное устройство на запасную.
        # ====================================================================
        - conditions:
            - condition: trigger
              id: start_aux_charge

            # Повторная страховочная проверка непосредственно перед командой.
            - condition: numeric_state
              entity_id: sensor.generator_aux_battery_voltage
              below: 12.4

            - condition: state
              entity_id: sensor.generator_battery_state
              state: "Поддержание"

            - condition: state
              entity_id: switch.generator_battery_charging
              state: "on"

          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.backup_generator_battery_charging

            - action: logbook.log
              data:
                name: "Зарядка запасной генераторной АКБ"
                entity_id: switch.backup_generator_battery_charging
                message: >
                  Запасная генераторная АКБ требует зарядки:
                  напряжение {{ states('sensor.generator_aux_battery_voltage')
                  | float(0) | round(2) }} В.
                  Основная генераторная АКБ находится в состоянии "Поддержание".
                  Зарядное устройство автоматически переключено на запасную АКБ.

        # ====================================================================
        # Запасная АКБ закончила основной цикл заряда и перешла в float.
        # Возвращаем зарядное устройство на основную АКБ.
        # ====================================================================
        - conditions:
            - condition: trigger
              id: aux_charge_complete

            # Возвращаем зарядку только если сейчас действительно заряжается
            # запасная АКБ. Если пользователь уже переключил всё вручную,
            # автоматика ничего не делает.
            - condition: state
              entity_id: switch.backup_generator_battery_charging
              state: "on"

            # Отсекаем явно низкое напряжение. После нормального перехода
            # в float ожидаем примерно 13.6 В.
            - condition: numeric_state
              entity_id: sensor.generator_aux_battery_voltage
              above: 13.2

          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.generator_battery_charging

            - action: logbook.log
              data:
                name: "Зарядка запасной генераторной АКБ"
                entity_id: switch.generator_battery_charging
                message: >
                  Заряд запасной генераторной АКБ завершён:
                  напряжение стабилизировалось в области буферного режима,
                  текущее значение
                  {{ states('sensor.generator_aux_battery_voltage')
                  | float(0) | round(2) }} В.
                  Зарядное устройство автоматически возвращено на основную
                  генераторную АКБ.
